name: AppClaw — iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flow:
        description: 'Path to YAML flow file (leave empty to use default)'
        required: false
        default: 'flows/ios/wifi-settings.yaml'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AppClaw flow on iOS simulator
        uses: AppiumTestDistribution/AppClaw@main
        with:
          platform: ios
          ios-device-type: simulator
          ios-simulator-name: iPhone 16
          flow: ${{ github.event.inputs.flow || 'flows/ios/wifi-settings.yaml' }}
          provider: openai
          api-key: ${{ secrets.OPENAI_API_KEY }}
          agent-mode: vision
          report: true
          report-name: appclaw-ios-report
