name: AppClaw — iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flow:
        description: 'Path to YAML flow file (leave empty to use default)'
        required: false
        default: 'flows/ios/wifi-settings.yaml'

jobs:
  ios:
    runs-on: macos-latest
    env:
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      VISION_MODE: ${{ vars.VISION_MODE }}
    steps:
      - uses: actions/checkout@v4

      - name: Run AppClaw flow on iOS simulator
        uses: AppiumTestDistribution/AppClaw@main
        with:
          platform: ios
          ios-device-type: simulator
          ios-simulator-name: iPhone 16
          flow: ${{ github.event.inputs.flow || 'flows/ios/wifi-settings.yaml' }}
          provider: ${{ vars.LLM_PROVIDER }}
          api-key: ${{ secrets.LLM_API_KEY }}
          model: ${{ vars.LLM_MODEL }}
          agent-mode: ${{ vars.AGENT_MODE }}
          step-delay: ${{ vars.STEP_DELAY }}
          report: true
          report-name: appclaw-ios-report
