name: AppClaw — Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flow:
        description: 'Path to YAML flow file (leave empty to use default)'
        required: false
        default: 'flows/android/wifi-settings.yaml'

jobs:
  android:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: android-ci
    env:
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      VISION_MODE: ${{ vars.VISION_MODE }}
    steps:
      - uses: actions/checkout@v5

      - name: Run AppClaw flow on Android emulator
        uses: AppiumTestDistribution/AppClaw@6fafa606a6fc8af5bfa8b0957ac5a6dab63304d9 # v1.3.4
        with:
          platform: android
          flow: ${{ github.event.inputs.flow || 'flows/android/wifi-settings.yaml' }}
          provider: ${{ vars.LLM_PROVIDER }}
          api-key: ${{ secrets.LLM_API_KEY }}
          model: ${{ vars.LLM_MODEL }}
          agent-mode: ${{ vars.AGENT_MODE }}
          step-delay: ${{ vars.STEP_DELAY }}
          android-api-level: '33'
          android-arch: x86_64
          android-profile: pixel_6
          report: true
          report-name: appclaw-android-report
